<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRADER</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
        }
        object, iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <!-- SVG faylni chaqirish (trader.svg bilan bir papkada bo'lishi kerak) -->
    <object data="trader.svg" type="image/svg+xml">
        <iframe src="trader.svg" frameborder="0"></iframe>
    </object>
</body>
</html>
