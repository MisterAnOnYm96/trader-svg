<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <defs>
    <style>
      text {
        font-family: 'Arial Black', 'Montserrat', sans-serif;
        font-weight: 900;
        fill: #ffffff;
        opacity: 0;
        animation-timing-function: cubic-bezier(0.25, 0.8, 0.25, 1);
      }

      /* Pastki qatordagi so'zlar */
      .base-word {
        text-anchor: middle;
        font-size: 70px;
      }

      /* Tepaga uchuvchi harflar */
      .top-letter {
        text-anchor: middle;
        font-size: 150px; 
      }

      /* =========================================
         ANIMATSIYA VAQTLARI
         ========================================= */
      #w-time { animation: showWord 0.5s 0.2s forwards, hideWord 0.1s 1.2s forwards; }
      #ime    { animation: hideWord 0.2s 1.0s forwards; }
      #l-t    { animation: flyUpT 0.8s 1.2s forwards; }

      #w-risk { animation: showWord 0.5s 1.8s forwards, hideWord 0.1s 2.8s forwards; }
      #isk    { animation: hideWord 0.2s 2.6s forwards; }
      #l-r    { animation: flyUpR 0.8s 2.8s forwards; }

      #w-analysis { animation: showWord 0.5s 3.4s forwards, hideWord 0.1s 4.4s forwards; }
      #nalysis    { animation: hideWord 0.2s 4.2s forwards; }
      #l-a        { animation: flyUpA 0.8s 4.4s forwards; }

      #w-discipline { animation: showWord 0.5s 5.0s forwards, hideWord 0.1s 6.0s forwards; }
      #iscipline    { animation: hideWord 0.2s 5.8s forwards; }
      #l-d          { animation: flyUpD 0.8s 6.0s forwards; }

      #w-emotion { animation: showWord 0.5s 6.6s forwards, hideWord 0.1s 7.6s forwards; }
      #motion    { animation: hideWord 0.2s 7.4s forwards; }
      #l-e       { animation: flyUpE 0.8s 7.6s forwards; }

      #w-reward { animation: showWord 0.5s 8.2s forwards, hideWord 0.1s 9.2s forwards; }
      #eward    { animation: hideWord 0.2s 9.0s forwards; }
      #l-r2     { animation: flyUpR2 0.8s 9.2s forwards; }

      /* ===== UMUMIY ANIMATSIYALAR ===== */
      @keyframes showWord {
        0% { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      @keyframes hideWord {
        0% { opacity: 1; }
        100% { opacity: 0; }
      }

      /* ===== DIAGONAL HARAKATLAR ===== */
      /* Harflar y=1100 dan boshlanib, siz bergan koordinatalarga uchadi.
         Hisoblash formulasi: (Y_final - 1100) */

      /* 1. T: (42 - 400 = -358), (986 - 1100 = -114) */
      @keyframes flyUpT {
        0% { opacity: 1; transform: translate(0, 0); }
        100% { opacity: 1; transform: translate(-358px, -114px); }
      }

      /* 2. R: (170 - 400 = -230), (880 - 1100 = -220) */
      @keyframes flyUpR {
        0% { opacity: 1; transform: translate(0, 0); }
        100% { opacity: 1; transform: translate(-230px, -220px); }
      }

      /* 3. A: (300 - 400 = -100), (797 - 1100 = -303) */
      @keyframes flyUpA {
        0% { opacity: 1; transform: translate(0, 0); }
        100% { opacity: 1; transform: translate(-100px, -303px); }
      }

      /* 4. D: (430 - 400 = +30), (675 - 1100 = -425) */
      @keyframes flyUpD {
        0% { opacity: 1; transform: translate(0, 0); }
        100% { opacity: 1; transform: translate(30px, -425px); }
      }

      /* 5. E: (568 - 400 = +168), (554 - 1100 = -546) */
      @keyframes flyUpE {
        0% { opacity: 1; transform: translate(0, 0); }
        100% { opacity: 1; transform: translate(168px, -546px); }
      }

      /* 6. R: (685 - 400 = +285), (461 - 1100 = -639) */
      @keyframes flyUpR2 {
        0% { opacity: 1; transform: translate(0, 0); }
        100% { opacity: 1; transform: translate(285px, -639px); }
      }
    </style>
  </defs>

  <!-- FON RASMI -->
  <image href="trader.jpg" x="0" y="0" width="800" height="1200" preserveAspectRatio="xMidYMid slice" />

  <!-- ================= PASTKI SO'ZLAR (y=1100 da, ya'ni harflar ostida) ================= -->
  <g class="base-word">
    <text id="w-time" x="400" y="1100">T<tspan id="ime">ime</tspan></text>
    <text id="w-risk" x="400" y="1100">R<tspan id="isk">isk</tspan></text>
    <text id="w-analysis" x="400" y="1100">A<tspan id="nalysis">nalysis</tspan></text>
    <text id="w-discipline" x="400" y="1100">D<tspan id="iscipline">iscipline</tspan></text>
    <text id="w-emotion" x="400" y="1100">E<tspan id="motion">motion</tspan></text>
    <text id="w-reward" x="400" y="1100">R<tspan id="eward">eward</tspan></text>
  </g>

  <!-- ================= TEPAGA UCHUVCHI HARFLAR (y=1100 dan boshlanadi) ================= -->
  <g class="top-letter">
    <text id="l-t"  x="400" y="1100">T</text>
    <text id="l-r"  x="400" y="1100">R</text>
    <text id="l-a"  x="400" y="1100">A</text>
    <text id="l-d"  x="400" y="1100">D</text>
    <text id="l-e"  x="400" y="1100">E</text>
    <text id="l-r2" x="400" y="1100">R</text>
  </g>

</svg>