<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <defs>
    <style>
      text {
        font-family: 'Arial Black', 'Montserrat', sans-serif;
        font-weight: 900;
        fill: #ffffff;
        opacity: 0;
        animation-timing-function: cubic-bezier(0.25, 0.8, 0.25, 1);
      }

      /* Pastki qatordagi so'zlar uchun qat'iy o'lcham va markaz */
      .base-word {
        text-anchor: middle;
        font-size: 70px; 
      }

      /* Tepaga uchuvchi harflar */
      .top-letter {
        text-anchor: middle;
        font-size: 150px; 
      }

      /* =========================================
         1. TIME
         ========================================= */
      #w-time { animation: showWord 0.5s 0.2s forwards, hideWord 0.1s 1.7s forwards; }
      #ime    { animation: hideWord 0.5s 1.2s forwards; }
      #l-t    { animation: flyUpT 0.8s 1.7s forwards; }

      /* =========================================
         2. RISK
         ========================================= */
      #w-risk { animation: showWord 0.5s 2.5s forwards, hideWord 0.1s 4.0s forwards; }
      #isk    { animation: hideWord 0.5s 3.5s forwards; }
      #l-r    { animation: flyUpR 0.8s 4.0s forwards; }

      /* =========================================
         3. ANALYSIS
         ========================================= */
      #w-analysis { animation: showWord 0.5s 4.8s forwards, hideWord 0.1s 6.3s forwards; }
      #nalysis    { animation: hideWord 0.5s 5.8s forwards; }
      #l-a        { animation: flyUpA 0.8s 6.3s forwards; }

      /* =========================================
         4. DISCIPLINE
         ========================================= */
      #w-discipline { animation: showWord 0.5s 7.1s forwards, hideWord 0.1s 8.6s forwards; }
      #iscipline    { animation: hideWord 0.5s 8.1s forwards; }
      #l-d          { animation: flyUpD 0.8s 8.6s forwards; }

      /* =========================================
         5. EMOTION
         ========================================= */
      #w-emotion { animation: showWord 0.5s 9.4s forwards, hideWord 0.1s 10.9s forwards; }
      #motion    { animation: hideWord 0.5s 10.4s forwards; }
      #l-e       { animation: flyUpE 0.8s 10.9s forwards; }

      /* =========================================
         6. REWARD
         ========================================= */
      #w-reward { animation: showWord 0.5s 11.7s forwards, hideWord 0.1s 13.2s forwards; }
      #eward    { animation: hideWord 0.5s 12.7s forwards; }
      #l-r2     { animation: flyUpR2 0.8s 13.2s forwards; }

      /* ===== UMUMIY ANIMATSIYALAR ===== */
      @keyframes showWord {
        0% { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      @keyframes hideWord {
        0% { opacity: 1; }
        100% { opacity: 0; }
      }

      /* ===== DIAGONAL HARAKATLAR ===== */
      @keyframes flyUpT {
        0% { opacity: 1; transform: translate(0, 0); }
        100% { opacity: 1; transform: translate(-358px, -114px); }
      }

      @keyframes flyUpR {
        0% { opacity: 1; transform: translate(0, 0); }
        100% { opacity: 1; transform: translate(-230px, -220px); }
      }

      @keyframes flyUpA {
        0% { opacity: 1; transform: translate(0, 0); }
        100% { opacity: 1; transform: translate(-100px, -303px); }
      }

      @keyframes flyUpD {
        0% { opacity: 1; transform: translate(0, 0); }
        100% { opacity: 1; transform: translate(30px, -425px); }
      }

      @keyframes flyUpE {
        0% { opacity: 1; transform: translate(0, 0); }
        100% { opacity: 1; transform: translate(168px, -546px); }
      }

      @keyframes flyUpR2 {
        0% { opacity: 1; transform: translate(0, 0); }
        100% { opacity: 1; transform: translate(285px, -639px); }
      }
    </style>
  </defs>

  <!-- FON RASMI -->
  <image href="trader.jpg" x="0" y="0" width="800" height="1200" preserveAspectRatio="xMidYMid slice" />

  <!-- ================= PASTKI SO'ZLAR (Barchasi alohida yozildi) ================= -->
  <g class="base-word">
    <text id="w-time" x="400" y="1100">T<tspan id="ime">ime</tspan></text>
    <text id="w-risk" x="400" y="1100">R<tspan id="isk">isk</tspan></text>
    <text id="w-analysis" x="400" y="1100">A<tspan id="nalysis">nalysis</tspan></text>
    <text id="w-discipline" x="400" y="1100">D<tspan id="iscipline">iscipline</tspan></text>
    <text id="w-emotion" x="400" y="1100">E<tspan id="motion">motion</tspan></text>
    <text id="w-reward" x="400" y="1100">R<tspan id="eward">eward</tspan></text>
  </g>

  <!-- ================= TEPAGA UCHUVCHI HARFLAR ================= -->
  <g class="top-letter">
    <text id="l-t"  x="400" y="1100">T</text>
    <text id="l-r"  x="400" y="1100">R</text>
    <text id="l-a"  x="400" y="1100">A</text>
    <text id="l-d"  x="400" y="1100">D</text>
    <text id="l-e"  x="400" y="1100">E</text>
    <text id="l-r2" x="400" y="1100">R</text>
  </g>

</svg>