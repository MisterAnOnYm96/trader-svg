<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Harflar uchun oq rang va soya effekti -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>
  
  <!-- Fon (Rasmni shu yerda qo'shishingiz mumkin) -->
  <rect width="500" height="500" fill="#0a1128" rx="10"/>

  <!-- Harflar guruhi. Ular bitta to'g'ri chiziq bo'ylab (pastdan yuqoriga) joylashgan -->
  <g font-family="Arial, sans-serif" font-weight="900" font-size="55" fill="#ffffff" filter="url(#shadow)">
    
    <!-- T harfi -->
    <text x="30" y="420" transform="rotate(-40, 30, 420)">T</text>
    
    <!-- R harfi -->
    <text x="100" y="360" transform="rotate(-40, 100, 360)">R</text>
    
    <!-- A harfi -->
    <text x="170" y="300" transform="rotate(-40, 170, 300)">A</text>
    
    <!-- D harfi -->
    <text x="240" y="240" transform="rotate(-40, 240, 240)">D</text>
    
    <!-- E harfi -->
    <text x="310" y="180" transform="rotate(-40, 310, 180)">E</text>
    
    <!-- R harfi (oxirgi) -->
    <text x="380" y="120" transform="rotate(-40, 380, 120)">R</text>
    
  </g>
</svg>