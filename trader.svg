<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Harflarga soya berish uchun -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>
  
  <!-- Orqa fon (ixtiyoriy, xohlasangiz o'chirib tashlashingiz mumkin) -->
  <rect width="600" height="600" fill="#0a1128" rx="20"/>

  <!-- Harflar guruhi. Hammasi bitta chiziq bo'ylab joylashgan -->
  <g font-family="Arial, sans-serif" font-weight="900" font-size="50" fill="#ffffff" filter="url(#shadow)">
    
    <!-- T -->
    <text x="20" y="550" transform="rotate(-40, 20, 550)">T</text>
    <!-- R -->
    <text x="80" y="500" transform="rotate(-40, 80, 500)">R</text>
    <!-- A -->
    <text x="140" y="450" transform="rotate(-40, 140, 450)">A</text>
    <!-- D -->
    <text x="200" y="400" transform="rotate(-40, 200, 400)">D</text>
    <!-- E -->
    <text x="260" y="350" transform="rotate(-40, 260, 350)">E</text>
    <!-- R -->
    <text x="320" y="300" transform="rotate(-40, 320, 300)">R</text>
    
    <!-- Bo'sh joy (TIME so'zi boshlanishidan oldin) -->
    
    <!-- T -->
    <text x="390" y="240" transform="rotate(-40, 390, 240)">T</text>
    <!-- I -->
    <text x="430" y="205" transform="rotate(-40, 430, 205)">I</text>
    <!-- M -->
    <text x="480" y="160" transform="rotate(-40, 480, 160)">M</text>
    <!-- E -->
    <text x="550" y="100" transform="rotate(-40, 550, 100)">E</text>
    
  </g>
</svg>