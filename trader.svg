<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <defs>
    <style>
      text {
        font-family: 'Arial Black', 'Montserrat', sans-serif;
        font-weight: 900;
        fill: #ffffff; /* Faqat oq rang */
        opacity: 0;
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); /* Silliq harakat uchun */
      }

      /* Barcha so'zlar va harflar uchun 120px o'lcham */
      .base-word, .top-letter {
        text-anchor: middle;
        font-size: 120px; 
      }

      /* Yonish (Glow) effekti - faqat oq rangda */
      .glow {
        filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8)) drop-shadow(0 0 20px rgba(255, 255, 255, 0.5));
      }

      /* =========================================
         ANIMATSIYA VAQTLARI
         ========================================= */
      /* 1. TIME */
      #w-time { animation: flickerIn 0.4s 0.2s forwards, fadeOutWord 0.1s 1.2s forwards; }
      #ime    { animation: fadeOutWord 0.3s 0.8s forwards; }
      #l-t    { animation: flyStraightT 0.8s 1.2s forwards; }

      /* 2. RISK */
      #w-risk { animation: flickerIn 0.4s 2.0s forwards, fadeOutWord 0.1s 3.0s forwards; }
      #isk    { animation: fadeOutWord 0.3s 2.6s forwards; }
      #l-r    { animation: flyStraightR 0.8s 3.0s forwards; }

      /* 3. ANALYSIS */
      #w-analysis { animation: flickerIn 0.4s 3.8s forwards, fadeOutWord 0.1s 4.8s forwards; }
      #nalysis    { animation: fadeOutWord 0.3s 4.4s forwards; }
      #l-a        { animation: flyStraightA 0.8s 4.8s forwards; }

      /* 4. DISCIPLINE */
      #w-discipline { animation: flickerIn 0.4s 5.6s forwards, fadeOutWord 0.1s 6.6s forwards; }
      #iscipline    { animation: fadeOutWord 0.3s 6.2s forwards; }
      #l-d          { animation: flyStraightD 0.8s 6.6s forwards; }

      /* 5. EMOTION */
      #w-emotion { animation: flickerIn 0.4s 7.4s forwards, fadeOutWord 0.1s 8.4s forwards; }
      #motion    { animation: fadeOutWord 0.3s 8.0s forwards; }
      #l-e       { animation: flyStraightE 0.8s 8.4s forwards; }

      /* 6. REWARD */
      #w-reward { animation: flickerIn 0.4s 9.2s forwards, fadeOutWord 0.1s 10.2s forwards; }
      #eward    { animation: fadeOutWord 0.3s 9.8s forwards; }
      #l-r2     { animation: flyStraightR2 0.8s 10.2s forwards; }

      /* =========================================
         KEYFRAMES
         ========================================= */
      /* Yonib paydo bo'lish effekti */
      @keyframes flickerIn {
        0% { opacity: 0; }
        30% { opacity: 1; }
        50% { opacity: 0.3; }
        70% { opacity: 1; }
        100% { opacity: 1; }
      }

      /* Yonib o'chish (so'nish) */
      @keyframes fadeOutWord {
        0% { opacity: 1; }
        100% { opacity: 0; }
      }

      /* =========================================
         TO'G'RI CHIZIQ BO'YLAB HARAKAT (Teng oraliqli X koordinatalar)
         ========================================= */
      
      /* T: X=42 (42 - 400 = -358) */
      @keyframes flyStraightT {
        0% { opacity: 1; transform: translate(0, 0); }
        100% { opacity: 1; transform: translate(-358px, -64px); }
      }

      /* R: X=171 (171 - 400 = -229) */
      @keyframes flyStraightR {
        0% { opacity: 1; transform: translate(0, 0); }
        100% { opacity: 1; transform: translate(-229px, -142px); }
      }

      /* A: X=299 (299 - 400 = -101) */
      @keyframes flyStraightA {
        0% { opacity: 1; transform: translate(0, 0); }
        100% { opacity: 1; transform: translate(-101px, -253px); }
      }

      /* D: X=428 (428 - 400 = 28) */
      @keyframes flyStraightD {
        0% { opacity: 1; transform: translate(0, 0); }
        100% { opacity: 1; transform: translate(28px, -375px); }
      }

      /* E: X=556 (556 - 400 = 156) */
      @keyframes flyStraightE {
        0% { opacity: 1; transform: translate(0, 0); }
        100% { opacity: 1; transform: translate(156px, -496px); }
      }

      /* R2: X=685 (685 - 400 = 285) */
      @keyframes flyStraightR2 {
        0% { opacity: 1; transform: translate(0, 0); }
        100% { opacity: 1; transform: translate(285px, -589px); }
      }
    </style>
  </defs>

  <!-- ORQA FON RASMI -->
  <image href="trader.jpg" x="0" y="0" width="800" height="1200" preserveAspectRatio="xMidYMid slice" />

  <!-- ================= PASTKI SO'ZLAR ================= -->
  <g class="base-word">
    <text id="w-time" x="400" y="1050" class="glow">T<tspan id="ime">ime</tspan></text>
    <text id="w-risk" x="400" y="1050" class="glow">R<tspan id="isk">isk</tspan></text>
    <text id="w-analysis" x="400" y="1050" class="glow">A<tspan id="nalysis">nalysis</tspan></text>
    <text id="w-discipline" x="400" y="1050" class="glow">D<tspan id="iscipline">iscipline</tspan></text>
    <text id="w-emotion" x="400" y="1050" class="glow">E<tspan id="motion">motion</tspan></text>
    <text id="w-reward" x="400" y="1050" class="glow">R<tspan id="eward">eward</tspan></text>
  </g>

  <!-- ================= TEPAGA UCHUVCHI HARFLAR ================= -->
  <g class="top-letter">
    <text id="l-t"  x="400" y="1050" class="glow">T</text>
    <text id="l-r"  x="400" y="1050" class="glow">R</text>
    <text id="l-a"  x="400" y="1050" class="glow">A</text>
    <text id="l-d"  x="400" y="1050" class="glow">D</text>
    <text id="l-e"  x="400" y="1050" class="glow">E</text>
    <text id="l-r2" x="400" y="1050" class="glow">R</text>
  </g>

</svg>