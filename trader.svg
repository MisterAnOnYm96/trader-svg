<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <defs>
    <style>
      

      text {
        font-family: 'Montserrat', 'Arial Black', sans-serif;
        font-weight: 900;
        text-anchor: middle;
        font-size: 160px; /* Asosiy oxirgi o'lcham */
        opacity: 0;
        animation-timing-function: cubic-bezier(0.25, 0.8, 0.25, 1);
      }

      /* =========================================
         RANGLAR VA PORLASH EFFEKTLARI
         ========================================= */
      .glow-t  { fill: #00f3ff; filter: drop-shadow(0 0 8px #00f3ff) drop-shadow(0 0 20px #00f3ff); }
      .glow-r  { fill: #ff007f; filter: drop-shadow(0 0 8px #ff007f) drop-shadow(0 0 20px #ff007f); }
      .glow-a  { fill: #39ff14; filter: drop-shadow(0 0 8px #39ff14) drop-shadow(0 0 20px #39ff14); }
      .glow-d  { fill: #ffaa00; filter: drop-shadow(0 0 8px #ffaa00) drop-shadow(0 0 20px #ffaa00); }
      .glow-e  { fill: #b721ff; filter: drop-shadow(0 0 8px #b721ff) drop-shadow(0 0 20px #b721ff); }
      .glow-r2 { fill: #ffd700; filter: drop-shadow(0 0 8px #ffd700) drop-shadow(0 0 20px #ffd700); }

      /* =========================================
         ANIMATSIYA VAQTLARI
         ========================================= */
      /* 1. TIME -> T */
      #w-time { animation: neonFlicker 0.5s 0.2s forwards, flyUpT 0.9s 1.2s forwards, pulse 2s 2.1s infinite alternate; }
      #ime    { animation: hideSuffix 0.2s 0.9s forwards; }

      /* 2. RISK -> R */
      #w-risk { animation: neonFlicker 0.5s 2.3s forwards, flyUpR 0.9s 3.3s forwards, pulse 2s 4.2s infinite alternate; }
      #isk    { animation: hideSuffix 0.2s 3.0s forwards; }

      /* 3. ANALYSIS -> A */
      #w-analysis { animation: neonFlicker 0.5s 4.4s forwards, flyUpA 0.9s 5.4s forwards, pulse 2s 6.3s infinite alternate; }
      #nalysis    { animation: hideSuffix 0.2s 5.1s forwards; }

      /* 4. DISCIPLINE -> D */
      #w-discipline { animation: neonFlicker 0.5s 6.5s forwards, flyUpD 0.9s 7.5s forwards, pulse 2s 8.4s infinite alternate; }
      #iscipline    { animation: hideSuffix 0.2s 7.2s forwards; }

      /* 5. EMOTION -> E */
      #w-emotion { animation: neonFlicker 0.5s 8.6s forwards, flyUpE 0.9s 9.6s forwards, pulse 2s 10.5s infinite alternate; }
      #motion    { animation: hideSuffix 0.2s 9.3s forwards; }

      /* 6. REWARD -> R */
      #w-reward { animation: neonFlicker 0.5s 10.7s forwards, flyUpR2 0.9s 11.7s forwards, pulse 2s 12.6s infinite alternate; }
      #eward    { animation: hideSuffix 0.2s 11.4s forwards; }

      /* =========================================
         KEYFRAMES
         ========================================= */
      @keyframes neonFlicker {
        0%   { opacity: 0; }
        20%  { opacity: 0.4; }
        40%  { opacity: 1; }
        60%  { opacity: 0.6; }
        100% { opacity: 1; }
      }

      /* Qo'shimcha qism shunchaki ko'rinmaydi, lekin o'rnini saqlab turadi */
      @keyframes hideSuffix {
        0%   { opacity: 1; }
        100% { opacity: 0; }
      }

      @keyframes pulse {
        0%   { opacity: 1; filter: drop-shadow(0 0 8px currentColor) drop-shadow(0 0 15px currentColor); }
        100% { opacity: 0.7; filter: drop-shadow(0 0 15px currentColor) drop-shadow(0 0 35px currentColor); }
      }

      /* =========================================
         O'ZGARMAS KOORDINATALAR VA SCALE ORQALI SILLIQ O'SISH
         (75px dan 160px ga nisbat: 75/160 ≈ 0.4687)
         ========================================= */

      /* T: (-300, -50) */
      @keyframes flyUpT {
        0%   { opacity: 1; transform: translate(0, 0) scale(0.4687); }
        100% { opacity: 1; transform: translate(-300px, -50px) scale(1); }
      }

      /* R: (-180, -170) */
      @keyframes flyUpR {
        0%   { opacity: 1; transform: translate(0, 0) scale(0.4687); }
        100% { opacity: 1; transform: translate(-180px, -170px) scale(1); }
      }

      /* A: (-60, -290) */
      @keyframes flyUpA {
        0%   { opacity: 1; transform: translate(0, 0) scale(0.4687); }
        100% { opacity: 1; transform: translate(-60px, -290px) scale(1); }
      }

      /* D: (60, -410) */
      @keyframes flyUpD {
        0%   { opacity: 1; transform: translate(0, 0) scale(0.4687); }
        100% { opacity: 1; transform: translate(60px, -410px) scale(1); }
      }

      /* E: (180, -530) */
      @keyframes flyUpE {
        0%   { opacity: 1; transform: translate(0, 0) scale(0.4687); }
        100% { opacity: 1; transform: translate(180px, -530px) scale(1); }
      }

      /* R2: (300, -650) */
      @keyframes flyUpR2 {
        0%   { opacity: 1; transform: translate(0, 0) scale(0.4687); }
        100% { opacity: 1; transform: translate(300px, -650px) scale(1); }
      }
    </style>
  </defs>

  <!-- ORQA FON RASMI -->
  

  <!-- ASOSIY SO'ZLAR -->
  <g>
    <text id="w-time" x="400" y="1050" class="glow-t">T<tspan id="ime">ime</tspan></text>
    <text id="w-risk" x="400" y="1050" class="glow-r">R<tspan id="isk">isk</tspan></text>
    <text id="w-analysis" x="400" y="1050" class="glow-a">A<tspan id="nalysis">nalysis</tspan></text>
    <text id="w-discipline" x="400" y="1050" class="glow-d">D<tspan id="iscipline">iscipline</tspan></text>
    <text id="w-emotion" x="400" y="1050" class="glow-e">E<tspan id="motion">motion</tspan></text>
    <text id="w-reward" x="400" y="1050" class="glow-r2">R<tspan id="eward">eward</tspan></text>
  </g>
</svg>