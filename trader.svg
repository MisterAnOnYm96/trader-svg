<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <defs>
    <style>
      text {
        font-family: 'Arial Black', 'Montserrat', sans-serif;
        font-weight: 900;
        fill: #ffffff; /* Barcha harflar va so'zlar oq rangda */
        opacity: 0;
        animation-timing-function: cubic-bezier(0.25, 0.8, 0.25, 1);
      }

      /* Barcha so'zlar va harflar uchun 120px o'lcham */
      .base-word, .top-letter {
        text-anchor: middle;
        font-size: 120px; 
      }

      /* Yonish (Glow) effekti - faqat oq rangda */
      .glow {
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9)) drop-shadow(0 0 25px rgba(255, 255, 255, 0.6));
      }

      /* =========================================
         ANIMATSIYA VAQTLARI
         ========================================= */
      /* 1. TIME */
      #w-time { animation: neonFlicker 0.5s 0.2s forwards, hideWord 0.1s 1.5s forwards; }
      #ime    { animation: hideWord 0.5s 1.0s forwards; }
      #l-t    { animation: flyUpT 0.8s 1.6s forwards, pulse 2s 2.4s infinite alternate; }

      /* 2. RISK */
      #w-risk { animation: neonFlicker 0.5s 2.2s forwards, hideWord 0.1s 3.5s forwards; }
      #isk    { animation: hideWord 0.5s 3.0s forwards; }
      #l-r    { animation: flyUpR 0.8s 3.6s forwards, pulse 2s 4.4s infinite alternate; }

      /* 3. ANALYSIS */
      #w-analysis { animation: neonFlicker 0.5s 4.2s forwards, hideWord 0.1s 5.5s forwards; }
      #nalysis    { animation: hideWord 0.5s 5.0s forwards; }
      #l-a        { animation: flyUpA 0.8s 5.6s forwards, pulse 2s 6.4s infinite alternate; }

      /* 4. DISCIPLINE */
      #w-discipline { animation: neonFlicker 0.5s 6.2s forwards, hideWord 0.1s 7.5s forwards; }
      #iscipline    { animation: hideWord 0.5s 7.0s forwards; }
      #l-d          { animation: flyUpD 0.8s 7.6s forwards, pulse 2s 8.4s infinite alternate; }

      /* 5. EMOTION */
      #w-emotion { animation: neonFlicker 0.5s 8.2s forwards, hideWord 0.1s 9.5s forwards; }
      #motion    { animation: hideWord 0.5s 9.0s forwards; }
      #l-e       { animation: flyUpE 0.8s 9.6s forwards, pulse 2s 10.4s infinite alternate; }

      /* 6. REWARD */
      #w-reward { animation: neonFlicker 0.5s 10.2s forwards, hideWord 0.1s 11.5s forwards; }
      #eward    { animation: hideWord 0.5s 11.0s forwards; }
      #l-r2     { animation: flyUpR2 0.8s 11.6s forwards, pulse 2s 12.4s infinite alternate; }

      /* =========================================
         KEYFRAMES
         ========================================= */
      @keyframes neonFlicker {
        0% { opacity: 0; }
        20% { opacity: 1; }
        40% { opacity: 0.2; }
        60% { opacity: 1; }
        80% { opacity: 0.5; }
        100% { opacity: 1; }
      }

      @keyframes hideWord {
        0% { opacity: 1; }
        100% { opacity: 0; }
      }

      @keyframes pulse {
        0% { opacity: 1; }
        100% { opacity: 0.6; }
      }

      /* =========================================
         DIAGONAL HARAKATLAR (Teng oraliqli yangi X koordinatalar)
         ========================================= */
      
      /* T: X=42 (42 - 400 = -358) */
      @keyframes flyUpT {
        0% { opacity: 1; transform: translate(0, 0); }
        100% { opacity: 1; transform: translate(-358px, -64px); }
      }

      /* R: X=171 (171 - 400 = -229) */
      @keyframes flyUpR {
        0% { opacity: 1; transform: translate(0, 0); }
        100% { opacity: 1; transform: translate(-229px, -142px); }
      }

      /* A: X=299 (299 - 400 = -101) */
      @keyframes flyUpA {
        0% { opacity: 1; transform: translate(0, 0); }
        100% { opacity: 1; transform: translate(-101px, -253px); }
      }

      /* D: X=428 (428 - 400 = 28) */
      @keyframes flyUpD {
        0% { opacity: 1; transform: translate(0, 0); }
        100% { opacity: 1; transform: translate(28px, -375px); }
      }

      /* E: X=556 (556 - 400 = 156) */
      @keyframes flyUpE {
        0% { opacity: 1; transform: translate(0, 0); }
        100% { opacity: 1; transform: translate(156px, -496px); }
      }

      /* R2: X=685 (685 - 400 = 285) */
      @keyframes flyUpR2 {
        0% { opacity: 1; transform: translate(0, 0); }
        100% { opacity: 1; transform: translate(285px, -589px); }
      }
    </style>
  </defs>

  <!-- ORQA FON RASMI -->
  <image href="trader.jpg" x="0" y="0" width="800" height="1200" preserveAspectRatio="xMidYMid slice" />

  <!-- ================= PASTKI SO'ZLAR ================= -->
  <g class="base-word">
    <text id="w-time" x="400" y="1050" class="glow">T<tspan id="ime">ime</tspan></text>
    <text id="w-risk" x="400" y="1050" class="glow">R<tspan id="isk">isk</tspan></text>
    <text id="w-analysis" x="400" y="1050" class="glow">A<tspan id="nalysis">nalysis</tspan></text>
    <text id="w-discipline" x="400" y="1050" class="glow">D<tspan id="iscipline">iscipline</tspan></text>
    <text id="w-emotion" x="400" y="1050" class="glow">E<tspan id="motion">motion</tspan></text>
    <text id="w-reward" x="400" y="1050" class="glow">R<tspan id="eward">eward</tspan></text>
  </g>

  <!-- ================= TEPAGA UCHUVCHI HARFLAR ================= -->
  <g class="top-letter">
    <text id="l-t"  x="400" y="1050" class="glow">T</text>
    <text id="l-r"  x="400" y="1050" class="glow">R</text>
    <text id="l-a"  x="400" y="1050" class="glow">A</text>
    <text id="l-d"  x="400" y="1050" class="glow">D</text>
    <text id="l-e"  x="400" y="1050" class="glow">E</text>
    <text id="l-r2" x="400" y="1050" class="glow">R</text>
  </g>

</svg>